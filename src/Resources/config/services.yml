services:
    _defaults:
        autowire: true          # Automatically injects dependencies in your services.
        autoconfigure: true     # Automatically registers your services as commands, event subscribers, etc.
        public: true           # Allows optimizing the container by removing unused services; this also means
                                # fetching services directly from the container via $container->get() won't work.
                                # The best practice is to be explicit about your dependencies anyway.
        bind:
            #$projectDir: '%kernel.project_dir%'

    Rhymedigital\IsotopeUpsShipping\:
        resource: ../../
        exclude: ../../{DependencyInjection,Resources,Model,Event}

    # Add a session bag
    Rhymedigital\IsotopeUpsShipping\Session\ApiResponseCache:
        arguments:
            - _rhymedigital_isotope_ups_shipping_api_response_cache
        calls:
            - [ setName, [ rhymedigital_isotope_ups_shipping ] ]

    rhyme.isotope.ups_shipping.ups_helper:
        class: Rhymedigital\IsotopeUpsShipping\Helper\UpsHelper
